<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Hunter</title>
  <style>
    :root { color-scheme: light; font: 16px/1.6 system-ui, sans-serif; color: #1c3035; background: #f4f6f4; }
    body { max-width: 1080px; margin: auto; padding: 24px; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 24px; border-bottom: 1px solid #d7dfda; }
    a { color: #146455; } h1 { line-height: 1.2; } small, .muted { color: #546762; }
    main { padding-top: 24px; } .panel { background: white; padding: 24px; border: 1px solid #d7dfda; border-radius: 12px; margin-bottom: 20px; }
    .button, button { display: inline-block; background: #146455; color: white; border: none; border-radius: 6px; padding: 10px 16px; font: inherit; text-decoration: none; cursor: pointer; }
    input, select, textarea { box-sizing: border-box; width: 100%; padding: 10px; font: inherit; border: 1px solid #9eafa7; border-radius: 5px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; } form p { margin-bottom: 20px; }
    .filters { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; } .filters input, .filters select { width: auto; max-width: 100%; }
    .table-wrap { overflow-x: auto; } table { width: 100%; border-collapse: collapse; } th, td { text-align: left; padding: 14px 10px; border-bottom: 1px solid #e3e9e5; }
    .text { white-space: pre-wrap; overflow-wrap: anywhere; } .errorlist { color: #ad2222; }
    dt { font-weight: 600; } dd { margin: 0 0 16px; }
  </style>
</head>
<body>
  <header><a href="{% url 'applications:list' %}"><strong>Job Hunter</strong></a><span class="muted">Your application workspace</span></header>
  <main>{% for message in messages %}<p class="panel" role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main>
</body>
</html>
